<html lang="zh-CN">

    <meta charset="UTF-8" />

    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./styles.css" />
  </head>

      <symbol id="icon-queue" viewBox="0 0 24 24">

      </symbol>
      <symbol id="icon-repeat" viewBox="0 0 24 24">
        <path d="M7.5 4.5h7A5.5 5.5 0 0 1 20 10v.9l.8-.8a1 1 0 0 1 1.4 1.42l-2.5 2.5a1 1 0 0 1-1.4 0l-2.5-2.5a1 1 0 1 1 1.4-1.42l.8.8V10a3.5 3.5 0 0 0-3.5-3.5h-7a1 1 0 1 1 0-2Zm-3.9 5.98a1 1 0 0 1 1.4 0l2.5 2.5a1 1 0 1 1-1.4 1.42l-.8-.8V14a3.5 3.5 0 0 0 3.5 3.5h7a1 1 0 1 1 0 2h-7A5.5 5.5 0 0 1 4 14v-.9l-.8.8a1 1 0 0 1-1.4-1.42l2.5-2.5Z" />
      </symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M12 20.2s-7.7-4.4-9.7-9.1C1 7.8 3.9 4.2 7.6 5.2c1.7.45 3.1 1.63 4.4 3 1.3-1.37 2.7-2.55 4.4-3 3.7-1 6.6 2.6 5.3 5.9-2 4.7-9.7 9.1-9.7 9.1Z" />
      </symbol>
      <symbol id="icon-more" viewBox="0 0 24 24">
        <path d="M5.5 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm6.5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm6.5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="M9.3 5.3a1 1 0 0 1 1.4 0l6.5 6.5a1 1 0 0 1 0 1.4l-6.5 6.5a1 1 0 0 1-1.4-1.4l5.79-5.8-5.8-5.8a1 1 0 0 1 0-1.4Z" />
      </symbol>
      <symbol id="icon-back" viewBox="0 0 24 24">
        <path d="M14.7 5.3a1 1 0 0 1 0 1.4L8.9 12.5l5.8 5.8a1 1 0 1 1-1.4 1.4l-6.5-6.5a1 1 0 0 1 0-1.4l6.5-6.5a1 1 0 0 1 1.4 0Z" />
      </symbol>
      <symbol id="icon-minimize" viewBox="0 0 24 24">
        <path d="M5 11h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2Z" />
      </symbol>
      <symbol id="icon-maximize" viewBox="0 0 24 24">
        <path d="M5 5h14v14H5V5Zm2 2v10h10V7H7Z" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6.1 6.1a1 1 0 0 1 1.4 0l4.5 4.5 4.5-4.5a1 1 0 1 1 1.4 1.4L13.4 12l4.5 4.5a1 1 0 0 1-1.4 1.4L12 13.4l-4.5 4.5a1 1 0 0 1-1.4-1.4l4.5-4.5-4.5-4.5a1 1 0 0 1 0-1.4Z" />
      </symbol>
      <symbol id="icon-close-small" viewBox="0 0 24 24">
        <path d="M7.1 7.1a1 1 0 0 1 1.4 0l3.5 3.5 3.5-3.5a1 1 0 1 1 1.4 1.4L13.4 12l3.5 3.5a1 1 0 0 1-1.4 1.4L12 13.4l-3.5 3.5a1 1 0 0 1-1.4-1.4l3.5-3.5-3.5-3.5a1 1 0 0 1 0-1.4Z" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5Z" />
      </symbol>
    </svg>

    <div class="app-shell" id="app">
      <div class="ambient-field" aria-hidden="true">
        <div class="ambient-scene is-active" data-ambient-scene="0">
          <i class="ambient-blob blob-a"></i>
          <i class="ambient-blob blob-b"></i>
          <i class="ambient-blob blob-c"></i>
        </div>
        <div class="ambient-scene" data-ambient-scene="1">
          <i class="ambient-blob blob-a"></i>
          <i class="ambient-blob blob-b"></i>
          <i class="ambient-blob blob-c"></i>
        </div>
      </div>
      <div class="noise"></div>

      <header class="titlebar" id="titlebar">
        <div class="titlebar-drag">
          <div class="wordmark">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 1024 1024"><path d="M274 492C366 294 438 294 512 474C586 654 658 654 750 456" /></svg>
            </span>
          </div>
          <span class="titlebar-separator"></span>
          <span class="titlebar-now" id="titlebar-now">漫游</span>
        </div>

        <div class="titlebar-actions">
          <button class="icon-button subtle" id="top-search-button" data-tooltip="搜索" data-tooltip-placement="bottom" aria-label="搜索">
            <svg><use href="#icon-search"></use></svg>
          </button>
          <button class="profile-pill" id="profile-button" data-tooltip="账户" data-tooltip-placement="bottom" aria-label="账户">
            <span class="avatar fallback-avatar" id="profile-avatar"><svg><use href="#icon-user"></use></svg></span>
            <span id="profile-name">登录</span>
          </button>
          <div class="window-controls">
            <button id="window-minimize" aria-label="最小化"><svg><use href="#icon-minimize"></use></svg></button>
            <button id="window-maximize" aria-label="最大化"><svg><use href="#icon-maximize"></use></svg></button>
            <button id="window-close" class="window-close" aria-label="关闭"><svg><use href="#icon-close"></use></svg></button>
          </div>
        </div>
      </header>

      <div class="app-layout">
        <nav class="rail" aria-label="主导航">
          <div class="rail-main">
            <button class="nav-button is-active" data-nav="now" data-tooltip="漫游" data-tooltip-placement="right" aria-label="漫游">
              <span class="nav-icon"><svg><use href="#icon-home"></use></svg></span>
            </button>
            <button class="nav-button" data-nav="search" data-tooltip="搜索" data-tooltip-placement="right" aria-label="搜索">
              <span class="nav-icon"><svg><use href="#icon-search"></use></svg></span>
            </button>
            <button class="nav-button" data-nav="library" data-tooltip="音乐库" data-tooltip-placement="right" aria-label="音乐库">
              <span class="nav-icon"><svg><use href="#icon-library"></use></svg></span>
            </button>
          </div>
          <div class="rail-bottom">
            <button class="rail-orb" id="queue-toggle" data-tooltip="播放队列" data-tooltip-placement="right" aria-label="播放队列">
              <svg><use href="#icon-queue"></use></svg>
            </button>
          </div>
        </nav>

        <main class="main-content" id="main-content">
          <section class="view is-active now-view" data-view="now" id="now-view">
            <div class="now-heading">
              <div>
                <h1>漫游</h1>
              </div>
            </div>

            <div class="now-grid">
              <section class="record-column">
                <div class="cover-stage" id="cover-stage">
                  <div class="vinyl-disc" id="vinyl-disc" aria-hidden="true">
                    <span></span>
                  </div>
                  <div class="cover-frame">
                    <img id="album-cover" alt="" />
                    <div class="cover-placeholder"><span>YQ</span></div>
                  </div>
                  <div class="cover-shadow"></div>
                </div>

                <div class="track-copy">
                  <div class="track-title-row">
                    <div class="track-title-block">
                      <div class="track-title-viewport" id="track-title-viewport">
                        <h2 id="track-name"></h2>
                      </div>
                      <p id="track-artist"></p>
                    </div>
                    <button class="icon-button" id="track-more" data-tooltip="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
                      <svg><use href="#icon-more"></use></svg>
                    </button>
                  </div>
                  <p class="album-name" id="track-album"></p>
                </div>

                <div class="timeline">
                  <input id="progress-range" type="range" min="0" max="1000" value="0" aria-label="播放进度" />
                  <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                  </div>
                </div>

                <div class="transport">
                  <button class="transport-secondary" id="shuffle-button" data-tooltip="随机播放" aria-label="随机播放">
                    <svg><use href="#icon-shuffle"></use></svg>
                  </button>
                  <button class="transport-side" id="prev-button" data-tooltip="上一首" aria-label="上一首">
                    <svg><use href="#icon-prev"></use></svg>
                  </button>
                  <button class="transport-main" id="play-button" data-tooltip="播放" aria-label="播放或暂停">
                    <svg><use href="#icon-play"></use></svg>
                  </button>
                  <button class="transport-side" id="next-button" data-tooltip="下一首" aria-label="下一首">
                    <svg><use href="#icon-next"></use></svg>
                  </button>
                  <button class="transport-secondary" id="repeat-button" data-tooltip="循环模式" aria-label="循环模式">
                    <svg><use href="#icon-repeat"></use></svg>
                  </button>
                </div>

                <div class="utility-row">
                  <button class="utility-button" id="like-button" data-tooltip="喜欢" aria-label="喜欢">
                    <svg><use href="#icon-heart"></use></svg>
                  </button>
                  <button class="utility-button" id="equalizer-button" data-tooltip="均衡器" aria-label="均衡器">
                    <svg><use href="#icon-equalizer"></use></svg>
                  </button>
                </div>
              </section>

              <section class="lyrics-column" id="lyrics-column">
                <div class="lyrics-heading">
                  <div>
                    <h2>歌词</h2>
                  </div>
                </div>
                <div class="lyrics-scroll" id="lyrics-scroll">
                  <div class="lyrics-list" id="lyrics-list">
                    <p class="lyric-placeholder"></p>
                  </div>
                </div>
              </section>
            </div>
          </section>

          <section class="view search-view" data-view="search" id="search-view">
            <div class="view-header search-header">
              <div>
                <h1>搜索</h1>
              </div>
            </div>

            <form class="search-form" id="search-form">
              <svg><use href="#icon-search"></use></svg>
              <input id="search-input" type="search" autocomplete="off" placeholder="输入歌曲、歌手或歌单" />
              <span class="search-shortcut">ENTER</span>
            </form>

            <div class="search-suggestions" id="search-suggestions">
              <span>搜索建议</span>
              <button data-query="告五人">告五人</button>
              <button data-query="方大同">方大同</button>
              <button data-query="夜晚">夜晚</button>
              <button data-query="爵士">爵士</button>
            </div>

            <div class="search-results" id="search-results">
              <div class="empty-state"></div>
            </div>
          </section>

          <section class="view library-view" data-view="library" id="library-view">
            <div class="view-header library-header">
              <div>
                <h1 id="library-title">收藏</h1>
              </div>
              <button class="outline-button" id="library-refresh-button">刷新</button>
            </div>
            <div id="library-content" class="library-content">
              <div class="loading-panel"><span></span></div>
            </div>
          </section>

          <section class="view playlist-view" data-view="playlist" id="playlist-view">
            <button class="back-button" id="playlist-back-button">
              <svg><use href="#icon-back"></use></svg>
              返回
            </button>
            <div id="playlist-content"></div>
          </section>
        </main>
      </div>

      <aside class="queue-panel" id="queue-panel" aria-hidden="true">
        <div class="queue-backdrop" id="queue-backdrop"></div>
        <div class="queue-sheet">
          <div class="queue-sheet-header">
            <div>
              <h2>播放队列</h2>
            </div>
            <button class="round-close" id="queue-close">
              <svg><use href="#icon-close-small"></use></svg>
            </button>
          </div>
          <div class="queue-summary">
            <span id="queue-summary-label"></span>
            <span id="queue-duration">0 分钟</span>
          </div>
          <div class="queue-list" id="queue-list"></div>
          <div class="queue-empty" id="queue-empty">
            <button class="outline-button" id="queue-find-button">去发现音乐</button>
          </div>
        </div>
      </aside>

      <aside class="equalizer-panel" id="equalizer-panel" aria-hidden="true">
        <div class="equalizer-backdrop" id="equalizer-backdrop"></div>
        <div class="equalizer-sheet">
          <div class="queue-sheet-header">
            <div>
              <h2>均衡器</h2>
            </div>
            <button class="round-close" id="equalizer-close">
              <svg><use href="#icon-close-small"></use></svg>
            </button>
          </div>

          <div class="equalizer-options">
            <label class="setting-toggle">
              <span>音量平衡</span>
              <input id="loudness-toggle" type="checkbox" checked />
              <i></i>
            </label>
            <label class="setting-toggle">
              <span>均衡器</span>
              <input id="equalizer-toggle" type="checkbox" checked />
              <i></i>
            </label>
          </div>

          <div class="equalizer-presets" id="equalizer-presets">
            <button data-preset="flat">平直</button>
            <button data-preset="warm">温暖</button>
            <button data-preset="vocal">人声</button>
            <button data-preset="bass">低频</button>
          </div>

          <div class="equalizer-bands" id="equalizer-bands"></div>
          <button class="outline-button equalizer-reset" id="equalizer-reset">恢复平直</button>
        </div>
      </aside>

      <div class="popover-backdrop" id="popover-backdrop"></div>
      <section class="profile-popover" id="profile-popover" aria-hidden="true">
        <div class="popover-profile">
          <span class="avatar large fallback-avatar" id="popover-avatar"><svg><use href="#icon-user"></use></svg></span>
          <div>
            <strong id="popover-name">游客</strong>
            <span id="popover-status">登录后使用账号偏好</span>
          </div>
        </div>
        <div class="platform-section">
          <span class="platform-label">主平台</span>
          <div class="primary-platform-switch">
            <button data-primary-provider="netease">网易云</button>
            <button data-primary-provider="kugou">酷狗</button>
            <button data-primary-provider="qq">QQ 音乐</button>
            <button data-primary-provider="qishui">汽水</button>
          </div>
          <button class="provider-account" data-login-provider="netease">
            <span>网易云音乐</span>
            <small>未登录</small>
          </button>
          <button class="provider-account" data-login-provider="kugou">
            <span>酷狗音乐</span>
            <small>未登录</small>
          </button>
          <button class="provider-account" data-login-provider="qq">
            <span>QQ 音乐</span>
            <small>未登录</small>
          </button>
          <button class="provider-account" data-login-provider="qishui">
            <span>汽水音乐</span>
            <small>未登录</small>
          </button>
        </div>
        <button class="popover-action" id="login-action">登录当前平台</button>
        <button class="popover-action" id="update-action">检查更新</button>
        <button class="popover-action muted" id="logout-action" hidden>退出登录</button>
      </section>

      <section class="track-menu" id="track-menu" role="menu" aria-hidden="true" aria-label="更多">
        <div class="track-menu-label">音质</div>
        <button class="track-menu-option is-active" data-quality-level="auto" role="menuitemradio" aria-checked="true">
          <span>自动</span>
          <small>最高可用</small>
        </button>
        <button class="track-menu-option" data-quality-level="jymaster" role="menuitemradio" aria-checked="false">
          <span>超清母带</span>
        </button>
        <button class="track-menu-option" data-quality-level="hires" role="menuitemradio" aria-checked="false">
          <span>Hi-Res</span>
        </button>
        <button class="track-menu-option" data-quality-level="lossless" role="menuitemradio" aria-checked="false">
          <span>无损</span>
        </button>
        <button class="track-menu-option" data-quality-level="exhigh" role="menuitemradio" aria-checked="false">
          <span>极高</span>
        </button>
        <button class="track-menu-option" data-quality-level="higher" role="menuitemradio" aria-checked="false">
          <span>较高</span>
        </button>
        <button class="track-menu-option" data-quality-level="standard" role="menuitemradio" aria-checked="false">
          <span>标准</span>
        </button>
      </section>

      <dialog class="login-dialog" id="provider-login-dialog">
        <div class="dialog-glow"></div>
        <button class="dialog-close" id="provider-login-close">
          <svg><use href="#icon-close-small"></use></svg>
        </button>
        <h2 id="provider-login-title">音乐登录</h2>
        <div class="qr-frame">
          <img id="provider-login-qr" alt="音乐登录二维码" />
          <div class="qr-loading" id="provider-login-loading"><span></span></div>
        </div>
        <p class="login-status" id="provider-login-status">正在生成二维码</p>
        <button class="text-button" id="provider-login-refresh">刷新二维码</button>
      </dialog>

      <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
      <div class="app-tooltip" id="app-tooltip" role="tooltip"></div>
    </div>

    <audio id="audio-element" preload="metadata"></audio>
    <script src="./app.js"></script>
  </body>
</html>
