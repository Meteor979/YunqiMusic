name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}".Trim().TrimStart("v")
          } else {
            $env:GITHUB_REF_NAME.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $package.version = $version
          $package |
            ConvertTo-Json -Depth 20 |
            Set-Content "package.json" -Encoding utf8
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            node node_modules/electron/install.js
          }

      - name: Build application package
        shell: pwsh
        run: node node_modules/electron-builder/out/cli/cli.js --dir

      - name: Prepare update assets
        shell: pwsh
        run: node scripts/make-update-assets.js

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            release/app.asar `
            release/update.json `
            --target "${{ github.sha }}" `
            --title "云栖音乐 $env:RELEASE_TAG" `
            --generate-notes
